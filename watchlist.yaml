# Quantum28 — watchlist. What the scheduler scans, and which pipeline each bucket routes to.
# Edit freely: run.py and scan_watchlist.py read this file. Nothing here trades on its own —
# every signal still passes the Risk Manager and waits for your Telegram/dashboard tap.

equities:                 # FULL 14-analyst equity vote (the Hermes/Claude brain) — scanned daily
  pipeline: equity_vote
  note: >
    A trimmed ~17-name large-cap Nasdaq set (from the top-30 by market cap, 2026). Mostly tech,
    semis, software and one biotech (AMGN). Each name costs ~$3/mo on the daily vote — edit freely.
  tickers: [NVDA, AAPL, MSFT, AMZN, GOOGL, META, AVGO, TSLA, NFLX,
            PLTR, CSCO, AMD,  INTU, ADBE, QCOM, MU,   AMGN]

indices:                  # 0DTE dealer-gamma trade (09:35 + 12:30 ET) — already scheduled
  pipeline: zero_dte
  tickers: [SPX, NDX, RUT]

commodities:              # directional OPTIONS only (spot-backed metals — no decay)
  pipeline: options
  note: >
    GLD and SLV are SPOT-backed (physically held metal), so they DON'T structurally decay — they are
    directional defined-risk OPTIONS candidates only. Nat-gas and crude decay is handled elsewhere:
    the levered-ETF decay sleeve already scans BOIL/KOLD (nat gas), UCO/SCO (crude) and the levered
    metals (AGQ/ZSL, NUGT/DUST) every 30 min. Direct GC/SI futures come online once IB is hosted.
  tickers: [GLD, SLV]                    # gold, silver — spot ETFs, options only
  futures_when_ib: [GC, SI]             # gold / silver futures, pending IB hosting

fx:                       # MONITOR-ONLY — feeds the fx-macro risk lens; no FX execution pipeline
  pipeline: monitor
  note: USD/CHF is watched as a cross-asset risk signal, not traded (no FX order path is wired).
  tickers: [USDCHF]

crypto:                   # MONITOR-ONLY — no crypto analyst/execution pipeline; ZEC not on Tasty/IB
  pipeline: monitor
  note: Prices watched for context only. Building a crypto trading pipeline is a separate project.
  tickers: [BTC, ETH]

schedule:
  equity_scan_et: "17:00"        # weekday ET time for the daily equity vote (EOD / overnight batch)
  monitor_et: ["09:45", "15:45"] # weekday ET times to log fx + crypto context
