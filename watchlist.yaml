# Quantum28 — watchlist. What the scheduler scans, and which pipeline each bucket routes to.
# Edit freely: run.py and scan_watchlist.py read this file. Nothing here trades on its own —
# every signal still passes the Risk Manager and waits for your Telegram/dashboard tap.

equities:                 # FULL 14-analyst equity vote (the Hermes/Claude brain) — scanned daily
  pipeline: equity_vote
  note: >
    Top ~30 Nasdaq-100 by market cap (snapshot, 2026). Membership and ranking drift as prices move
    and the index rebalances quarterly — treat this as a starting universe and edit as you like.
  tickers: [NVDA, AAPL, MSFT, AMZN, GOOGL, META, AVGO, TSLA, COST, NFLX,
            TMUS, PLTR, CSCO, AMD,  PEP,  LIN,  INTU, ADBE, TXN,  QCOM,
            AMAT, MU,   AMGN, ISRG, BKNG, HON,  ADP,  GILD, VRTX, MRVL]

indices:                  # 0DTE dealer-gamma trade (09:35 + 12:30 ET) — already scheduled
  pipeline: zero_dte
  tickers: [SPX, NDX, RUT]

commodities:              # options + structural-decay sleeve
  pipeline: options_decay
  note: >
    Tradeable TODAY as defined-risk OPTIONS on the liquid ETFs via Tastytrade; the structural-decay
    engine already scans their levered versions every 30 min. Direct futures (GC/SI/NG/CL on IB)
    come online once IB Gateway is hosted somewhere the cloud service can reach.
  tickers: [GLD, SLV, UNG, USO]          # gold, silver, natural gas, crude — ETF proxies
  futures_when_ib: [GC, SI, NG, CL]      # the direct instruments, pending IB hosting

fx:                       # MONITOR-ONLY — feeds the fx-macro risk lens; no FX execution pipeline
  pipeline: monitor
  note: USD/CHF is watched as a cross-asset risk signal, not traded (no FX order path is wired).
  tickers: [USDCHF]

crypto:                   # MONITOR-ONLY — no crypto analyst/execution pipeline; ZEC not on Tasty/IB
  pipeline: monitor
  note: Prices watched for context only. Building a crypto trading pipeline is a separate project.
  tickers: [BTC, ETH, ZEC]

schedule:
  equity_scan_et: "17:00"        # weekday ET time for the daily equity vote (EOD / overnight batch)
  monitor_et: ["09:45", "15:45"] # weekday ET times to log fx + crypto context
