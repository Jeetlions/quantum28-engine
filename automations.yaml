# Scheduled automations for Quantum28 (cron; times are US/Eastern to track the cash session).
# The Strategist is a constructor — it builds ON DEMAND when the pipeline runs. "Daily" comes
# from HERE: these entries invoke the pipeline on a schedule. Deploy on the Hermes agent's
# scheduler (survives restarts). Every run still routes through the Telegram HITL before any
# order ticket is written — nothing here trades or moves money on its own.

automations:
  # ---- 0DTE index gamma trade (SPX / NDX) --------------------------------------
  # Same-day expiry is a pure gamma trade, and the two structure families want DIFFERENT clocks:
  #   * BREAKOUTS (negative gamma -> ratio backspread / reverse fly) are long gamma — get positioned
  #     EARLY, before the move. The opening pass owns these.
  #   * PINNING FLIES (positive gamma -> BWB) are short gamma — do NOT put them on into the noisy
  #     morning, and the 9:30 wall is still forming. The Strategist stands them aside before ~11:30 ET
  #     (FLY_EARLIEST_ET), so the MIDDAY pass is their primary entry, on the stabilized wall.
  - name: zero_dte_open
    cron: "35 9 * * 1-5"          # 09:35 ET — catches BREAKOUTS; flies auto-stand-aside (wall forming)
    command: "python3 orchestrator.py run --ticker SPX --tenor 0DTE && python3 orchestrator.py run --ticker NDX --tenor 0DTE"
    note: >
      Negative gamma -> breakout (long-gamma) NOW. Positive gamma -> the pinning fly is deferred to the
      midday pass (wall still forming). Stale read -> stand aside.

  - name: zero_dte_midday
    cron: "30 12 * * 1-5"         # 12:30 ET — PRIMARY window to establish positive-gamma flies / BWB
    command: "python3 orchestrator.py run --ticker SPX --tenor 0DTE && python3 orchestrator.py run --ticker NDX --tenor 0DTE"
    note: >
      The wall has set on the morning's flow: center the BWB on the now-stable pin (magnet tightens into
      the close). Also re-checks the regime — a morning-positive book can flip negative by midday.

  # ---- daily equity/options pipeline + housekeeping ----------------------------
  - name: morning_brief
    cron: "0 7 * * 1-5"           # 07:00 ET — overnight digest + the day's proposed signals
    command: "python3 brief.py"

  - name: performance_report
    cron: "30 16 * * 1-5"         # 16:30 ET — after the cash close, mark the book + refresh the scorecard
    command: "python3 performance.py"

  - name: decay_scan_intraday
    cron: "*/30 10-15 * * 1-5"    # every 30 min, 10:00–15:30 ET — INTRADAY decay signals
    command: "python3 decay_signals.py"
    note: >
      Decay setups are intraday: a VIX spike to 55 that closes near 30 is gone by EOD, so the sleeve
      is re-evaluated through the session, not once daily. Signals feed cio.py --sleeve levered_etf.

  - name: basis_scan
    cron: "0 10,14 * * 1-5"       # 10:00 & 14:00 ET — scan single-stock-futures basis for dislocations
    command: "python3 basis.py"
    note: "Market-neutral cash-and-carry / reverse. MONITOR-ONLY until CME single-stock futures list (Sept 2026); no order tickets before go-live."

  - name: reweight
    cron: "0 18 * * 5"            # Fri 18:00 ET — weekly: re-score analysts, refresh vote weights
    command: "python3 benchmarks/benchmark.py"

  - name: recalibrate
    cron: "30 18 * * 5"          # Fri 18:30 ET — weekly: re-tune entry params (put-write buffer, IV floors)
    command: "python3 calibration.py"
