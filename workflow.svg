<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1780" viewBox="0 0 1640 1780">
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="0" y="0" width="1640" height="1780" fill="#ffffff"/>
<text x="820.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal">Multi-Agent Risk Pipeline — Information Flow</text>
<text x="820.0" y="72" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">Agents never talk to each other; they hand off structured JSON files through a shared folder.</text>
<rect x="540.0" y="95" width="560" height="54" rx="12" fill="#EEF1F4" stroke="#4B5563" stroke-width="2"/>
<text x="820.0" y="125" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#4B5563" text-anchor="middle" font-weight="bold" font-style="normal">Trigger</text>
<text x="820.0" y="153" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">orchestrator.py run --ticker NVDA   (cron or on-demand)</text>
<line x1="820.0" y1="149" x2="820.0" y2="183" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="490.0" y="185" width="660" height="66" rx="12" fill="#FBE9E7" stroke="#B4322E" stroke-width="2"/>
<text x="820.0" y="215" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#B4322E" text-anchor="middle" font-weight="bold" font-style="normal">Auth gate</text>
<text x="820.0" y="243" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">authenticate caller (allowlist)  +  authorize ticker (restricted list)</text>
<text x="1165.0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5b6472" text-anchor="start" font-weight="normal" font-style="italic">who may invoke</text>
<text x="1165.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5b6472" text-anchor="start" font-weight="normal" font-style="italic">+ what may be touched</text>
<line x1="820.0" y1="251" x2="820.0" y2="286" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="820.0" y="300" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal">Analysts run as isolated subagents — each writes a structured  *_view.json  to  shared/</text>
<rect x="60" y="320" width="760" height="420" rx="12" fill="#DCE6F5" stroke="#2E6DB4" stroke-width="2"/>
<text x="440.0" y="350" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2E6DB4" text-anchor="middle" font-weight="bold" font-style="normal">VOTERS  —  weighted vote on DIRECTION</text>
<text x="88" y="390" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Fundamental  → fundamental_view.json</text>
<text x="88" y="430" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Technical   → technical_view.json</text>
<text x="88" y="470" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Insider     → insider_view.json</text>
<text x="88" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Quant/Factor → quant_view.json</text>
<text x="88" y="550" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Options     → options_view.json</text>
<text x="88" y="590" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Earnings-Quality (can veto) → quality_view.json</text>
<text x="88" y="630" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Catalyst    → catalyst_view.json</text>
<text x="88" y="670" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• Alt-Data    → altdata_view.json</text>
<text x="88" y="710" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1a2b3c" text-anchor="start" font-weight="normal" font-style="normal">• News        → news_view.json  (curated facts, not mood)</text>
<rect x="840" y="320" width="740" height="340" rx="12" fill="#FBEED2" stroke="#B7791F" stroke-width="2"/>
<text x="1210.0" y="350" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#B7791F" text-anchor="middle" font-weight="bold" font-style="normal">OVERLAYS  —  trim size / veto (no direction)</text>
<text x="868" y="390" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3a2c10" text-anchor="start" font-weight="normal" font-style="normal">• Sentiment → sentiment_view.json  (crowd mood)</text>
<text x="868" y="430" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3a2c10" text-anchor="start" font-weight="normal" font-style="normal">• Macro    → macro_view.json  (+ FRED / Bull&amp;Bear)</text>
<text x="868" y="470" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3a2c10" text-anchor="start" font-weight="normal" font-style="normal">• Credit   → credit_view.json</text>
<text x="868" y="510" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3a2c10" text-anchor="start" font-weight="normal" font-style="normal">• Liquidity → liquidity_view.json</text>
<text x="868" y="550" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3a2c10" text-anchor="start" font-weight="normal" font-style="normal">• FX-Macro → fx_macro_view.json  (yen / carry / CB intervention)</text>
<rect x="860" y="678" width="700" height="60" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="1210.0" y="702" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#B7791F" text-anchor="middle" font-weight="bold" font-style="normal">INPUT GUARDRAIL  (untrusted MCP/web content)</text>
<text x="1210.0" y="724" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3a2c10" text-anchor="middle" font-weight="normal" font-style="normal">Sentiment &amp; Alt-Data: sanitize posts; drop prompt-injection</text>
<line x1="440.0" y1="740" x2="440.0" y2="798" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1210.0" y1="738" x2="1210.0" y2="798" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="60" y="800" width="1520" height="62" rx="12" fill="#E4F1E1" stroke="#4A7A43" stroke-width="2"/>
<text x="820.0" y="826" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#4A7A43" text-anchor="middle" font-weight="bold" font-style="normal">OUTPUT GUARDRAIL</text>
<text x="820.0" y="850" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#22331f" text-anchor="middle" font-weight="normal" font-style="normal">validate every view: schema  +  freshness (as_of)  +  injection scan   →   reject stale / malformed before it is trusted</text>
<line x1="820.0" y1="862" x2="820.0" y2="896" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="820.0" y="912" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">shared/*.json   —   durable hand-off (agents share files, they do not message each other)</text>
<rect x="350.0" y="928" width="940" height="132" rx="12" fill="#EAF1FB" stroke="#2E6DB4" stroke-width="2.5"/>
<text x="820.0" y="958" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2E6DB4" text-anchor="middle" font-weight="bold" font-style="normal">RISK  MANAGER</text>
<text x="820.0" y="990" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a2b3c" text-anchor="middle" font-weight="normal" font-style="normal">weighted vote (voters):  Σ(weight × conviction × direction);  |net| ≥ threshold ⇒ aligned</text>
<text x="820.0" y="1018" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1a2b3c" text-anchor="middle" font-weight="normal" font-style="normal">apply overlays:  negative score trims size;  score ≤ −0.5 vetoes</text>
<text x="820.0" y="1044" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2E6DB4" text-anchor="middle" font-weight="bold" font-style="normal">→  writes  risk_decision.json   (one decision from all views)</text>
<line x1="820.0" y1="1060" x2="820.0" y2="1098" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<polygon points="820.0,1098 970.0,1152 820.0,1206 670.0,1152" fill="#FFF3CD" stroke="#B7791F" stroke-width="2.5"/>
<text x="820.0" y="1158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#3a2c10" text-anchor="middle" font-weight="bold" font-style="normal">tradeable?</text>
<line x1="970.0" y1="1152" x2="1150.0" y2="1152" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1150.0" y="1122" width="250" height="60" rx="12" fill="#EEF1F4" stroke="#4B5563" stroke-width="2"/>
<text x="1275.0" y="1152" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#4B5563" text-anchor="middle" font-weight="bold" font-style="normal">No</text>
<text x="1275.0" y="1180" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">no trade — log only</text>
<text x="804.0" y="1232" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#4A7A43" text-anchor="end" font-weight="bold" font-style="normal">yes</text>
<line x1="820.0" y1="1206" x2="820.0" y2="1246" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="490.0" y="1246" width="660" height="66" rx="12" fill="#EBE3F7" stroke="#6B46C1" stroke-width="2"/>
<text x="820.0" y="1276" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#6B46C1" text-anchor="middle" font-weight="bold" font-style="normal">SUSPEND  (human-in-the-loop)</text>
<text x="820.0" y="1304" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">persist state → pending_approvals/  (survives a server restart)</text>
<line x1="820.0" y1="1312" x2="820.0" y2="1346" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="490.0" y="1346" width="660" height="60" rx="12" fill="#EBE3F7" stroke="#6B46C1" stroke-width="2"/>
<text x="820.0" y="1376" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#6B46C1" text-anchor="middle" font-weight="bold" font-style="normal">Telegram</text>
<text x="820.0" y="1404" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">✅ APPROVE            ❌ DISAPPROVE</text>
<line x1="620.0" y1="1406" x2="620.0" y2="1442" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="460.0" y="1442" width="320" height="52" rx="12" fill="#EEF1F4" stroke="#4B5563" stroke-width="2"/>
<text x="620.0" y="1472" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#4B5563" text-anchor="middle" font-weight="bold" font-style="normal">Disapprove</text>
<text x="620.0" y="1500" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">no order created</text>
<line x1="1020.0" y1="1406" x2="1020.0" y2="1442" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="860.0" y="1442" width="320" height="52" rx="12" fill="#E4F1E1" stroke="#4A7A43" stroke-width="2"/>
<text x="1020.0" y="1472" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#4A7A43" text-anchor="middle" font-weight="bold" font-style="normal">Approve → RESUME</text>
<text x="1020.0" y="1500" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">fresh process picks up state</text>
<line x1="1020.0" y1="1494" x2="1020.0" y2="1528" stroke="#444" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="840.0" y="1528" width="360" height="64" rx="12" fill="#E4F1E1" stroke="#4A7A43" stroke-width="2"/>
<text x="1020.0" y="1558" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#4A7A43" text-anchor="middle" font-weight="bold" font-style="normal">Order ticket → orders/</text>
<text x="1020.0" y="1586" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">execution desk places it —</text>
<text x="1020.0" y="1612" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="normal">the agent never trades / moves money</text>
<rect x="60" y="1616" width="1520" height="116" rx="12" fill="#EEF1F4" stroke="#4B5563" stroke-width="2" stroke-dasharray="6 4"/>
<text x="820.0" y="1644" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#4B5563" text-anchor="middle" font-weight="bold" font-style="normal">FEEDBACK  LOOP</text>
<text x="820.0" y="1672" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">decision_log.jsonl  +  outcomes.jsonl   →   benchmark.py  (Sharpe ratio, max drawdown)   →   analyst_weights.json</text>
<text x="820.0" y="1700" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="normal" font-style="normal">verdict: IMPROVED / REGRESSED / UNCHANGED   ·   weights feed back into the voters&#x27; next vote</text>
<text x="820.0" y="1722" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">objective = risk-adjusted return (Sharpe); drawdown is a guardrail</text>
<path d="M60,1674 L34,1674 L34,994 L350.0,994" fill="none" stroke="#4A7A43" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="42" y="1272.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4A7A43" text-anchor="start" font-weight="normal" font-style="italic">updates voter weights</text>
<rect x="1150" y="1232" width="478" height="250" rx="12" fill="#EAF7EE" stroke="#4A7A43" stroke-width="2"/>
<text x="1389.0" y="1258" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4A7A43" text-anchor="middle" font-weight="bold" font-style="normal">OPTIONS CONSTRUCTORS</text>
<text x="1389.0" y="1279" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#33553a" text-anchor="middle" font-weight="normal" font-style="italic">(when the view is tradeable)</text>
<text x="1166" y="1306" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#22331f" text-anchor="start" font-weight="normal" font-style="normal">Wheel: put_write (long, below floors) /</text>
<text x="1166" y="1336" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#22331f" text-anchor="start" font-weight="normal" font-style="normal">   call_write (short, bear-call above ceilings);</text>
<text x="1166" y="1366" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#22331f" text-anchor="start" font-weight="normal" font-style="normal">   covered call if a put is assigned</text>
<text x="1166" y="1396" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#22331f" text-anchor="start" font-weight="normal" font-style="normal">Strategist -&gt; structure_ticket.json:</text>
<text x="1166" y="1426" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#22331f" text-anchor="start" font-weight="normal" font-style="normal">   vertical / diagonal / calendar / butterfly / condor</text>
<text x="1166" y="1456" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#22331f" text-anchor="start" font-weight="normal" font-style="normal">   equity = American;  index (SPX/NDX) = cash, European</text>
<path d="M1290,994 L1600,994 L1600,1232" fill="none" stroke="#4A7A43" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="1410" y="984" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">if tradeable</text>
</svg>